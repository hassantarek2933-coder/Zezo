<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وِصال | دردشة الأصدقاء</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>وِصال <span>●</span></h1>
    <p>دردشتك الخاصة مع أصدقائك</p>
  </header>

  <main class="container">
    <section id="authPanel" class="card">
      <h2>أهلاً بيك 👋</h2>
      <p>سجّل دخولك أو أنشئ حسابًا جديدًا</p>

      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">

      <button id="signupBtn">إنشاء حساب</button>
      <button id="loginBtn" class="secondary">تسجيل الدخول</button>
      <p id="authStatus"></p>
    </section>

    <section id="chatPanel" class="card hidden">
      <div class="chat-header">
        <div>
          <h2>دردشة الأصدقاء</h2>
          <p id="userLabel"></p>
        </div>
        <button id="logoutBtn" class="secondary">خروج</button>
      </div>

      <div id="approvalNotice" class="notice hidden">
        حسابك في انتظار موافقة المسؤول.
      </div>

      <div id="messages" class="messages">
        <p class="empty">رسائلك هتظهر هنا 💬</p>
      </div>

      <form id="messageForm">
        <input id="messageInput" maxlength="1000"
          placeholder="اكتب رسالتك..." autocomplete="off">
        <button id="sendBtn" type="submit">إرسال</button>
      </form>

      <p id="chatStatus"></p>
    </section>
  </main>

  <footer>وِصال © 2026 — معًا نتواصل</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
